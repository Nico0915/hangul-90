<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FAFAF7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="한글90" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" type="image/png" href="icon.png" />
<title>한글 90 · 碎片时间学韩语</title>
<link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
<div class="shell">

  <header class="topbar">
    <div class="logo">
      <span class="logo-ko">한글</span><span class="logo-num">90</span>
    </div>
    <div class="topbar-right">
      <button class="streak-chip" id="streakChip" type="button" title="连续学习天数">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M8 1.5c2.2 2.2 3.5 3.9 3.5 5.8A3.5 3.5 0 0 1 8 10.8a3.5 3.5 0 0 1-3.5-3.5C4.5 5.4 5.8 3.7 8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.2"/>
          <path d="M8 14.5v-2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span id="streakNum">0</span><span class="unit">天</span>
      </button>
    </div>
  </header>

  <main id="view" class="view" role="main"></main>

  <nav class="tabbar" id="tabbar" aria-label="主导航">
    <button class="tab is-active" data-view="home" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 8.5 10 3l6.5 5.5V16a1 1 0 0 1-1 1h-3.2v-4.4H7.7V17H4.5a1 1 0 0 1-1-1V8.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-view="plan" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.2" y="4.5" width="13.6" height="12.3" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.2 8.4h13.6M7 3.2v2.6M13 3.2v2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>计划</span>
    </button>
    <button class="tab" data-view="basics" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.5h5.2a2 2 0 0 1 2 2v11a1.6 1.6 0 0 0-1.6-1.6H4V3.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M16 3.5h-4.8a2 2 0 0 0-2 2v11a1.6 1.6 0 0 1 1.6-1.6H16V3.5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span>基础</span>
    </button>
    <button class="tab" data-view="practice" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h10a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 15V5A1.5 1.5 0 0 1 5 3.5Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m6.8 10.2 2.1 2.1 4.3-4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>练习</span>
    </button>
    <button class="tab" data-view="commute" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2v9.4M6.4 6.8 10 3.2l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13.2v1.6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>通勤</span>
    </button>
    <button class="tab" data-view="cards" type="button">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.4" y="5.6" width="13.2" height="9.6" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.6 3.4h8.2a1.6 1.6 0 0 1 1.6 1.6v.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>速查</span>
    </button>
  </nav>

</div>
<script src="data.js?v=5"></script>
<script src="timeline.js?v=5"></script>
<script src="app.js?v=5"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { });
  });
}
</script>
</body>
</html>
